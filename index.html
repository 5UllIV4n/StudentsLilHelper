<!DOCTYPE html>
<html lang="en" class="bg-gray-50 h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essential Education - Automation Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0056b3',
                            light: '#e6f0fa',
                            dark: '#003d82'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Base styles to ensure consistency */
        body { font-family: 'Inter', system-ui, sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="h-full flex flex-col">

    <!-- 1. LOGIN VIEW -->
    <div id="login-view" class="flex-1 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Sign in to your account</h2>
            <p class="mt-2 text-center text-sm text-gray-600">Student Portal Mockup</p>
        </div>

        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
                <!-- Exact form elements required by script -->
                <form onsubmit="handleLogin(event)" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username</label>
                        <div class="mt-1">
                            <!-- REQUIRED: <input type='text' name='username'> -->
                            <input type="text" name="username" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="mt-1">
                            <!-- REQUIRED: <input type='password' name='password'> -->
                            <input type="password" name="password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <!-- REQUIRED: <input type='submit'> -->
                        <input type="submit" value="Login" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none cursor-pointer">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. DASHBOARD VIEW -->
    <div id="dashboard-view" class="hidden flex-col h-full">
        <nav class="bg-blue-800 shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex">
                        <div class="flex-shrink-0 flex items-center text-white font-bold text-xl">
                            Academy Hub
                        </div>
                        <div class="ml-6 flex space-x-8 items-center">
                            <!-- REQUIRED: <a href='#' role='link'>Academy</a> -->
                            <a href="#" role="link" class="text-white hover:bg-blue-700 px-3 py-2 rounded-md text-sm font-medium">Academy</a>
                            
                            <!-- REQUIRED: <a href='#' data-url='set-study-location/1'> -->
                            <a href="#" data-url="set-study-location/1" class="text-blue-200 hover:bg-blue-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Study Location</a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-7xl w-full mx-auto py-10 px-4 sm:px-6 lg:px-8">
            <div class="bg-white shadow overflow-hidden sm:rounded-lg border border-gray-200">
                <div class="px-4 py-5 border-b border-gray-200 sm:px-6 flex justify-between items-center bg-gray-50">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">Current Course</h3>
                    <span class="px-2 py-1 text-xs font-semibold bg-green-100 text-green-800 rounded-full">In Progress</span>
                </div>
                <div class="px-4 py-12 sm:px-6 text-center space-y-6">
                    <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    </div>
                    
                    <!-- REQUIRED: <h4 class='next-btn'> -->
                    <h4 class="next-btn inline-flex items-center px-6 py-4 border border-transparent text-lg font-medium rounded-md shadow-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none cursor-pointer transition-transform hover:scale-105 active:scale-95" onclick="startLesson()">
                        Continue Next Lesson
                    </h4>
                    <p class="text-sm text-gray-500 max-w-md mx-auto mt-4">Clicking the button above will launch the interactive lesson player.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 3. LESSON VIEW (Iframe Container) -->
    <div id="lesson-view" class="hidden h-full flex-col bg-gray-900 overflow-hidden">
        <div class="bg-gray-800 px-4 py-3 flex justify-between items-center text-white">
            <div class="font-mono text-sm">Interactive Lesson Player</div>
            <button onclick="exitLesson()" class="text-gray-400 hover:text-white text-sm">Exit</button>
        </div>
        <div id="iframe-container" class="flex-1 w-full h-full p-4 flex items-center justify-center">
            <!-- Iframe will be injected here via Blob URL -->
        </div>
    </div>

    <script>
        // --- Main App Logic --- //
        
        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('flex');
        }

        function exitLesson() {
            document.getElementById('lesson-view').classList.add('hidden');
            document.getElementById('lesson-view').classList.remove('flex');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('flex');
            document.getElementById('iframe-container').innerHTML = '';
        }

        // --- Iframe Generation (The crucial part for the Playwright script) --- //
        function startLesson() {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('flex');
            
            const lessonView = document.getElementById('lesson-view');
            lessonView.classList.remove('hidden');
            lessonView.classList.add('flex');

            // Constructing the inner HTML for the iframe.
            // All required elements, exact classes, and aria-labels are injected here.
            const iframeHTML = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <script src="https://cdn.tailwindcss.com"><\/script>
                    <style>
                        body { font-family: sans-serif; background: #fff; margin: 0; display: flex; flex-direction: column; min-height: 100vh;}
                        .slide { display: none; flex: 1; padding: 2rem; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
                        .slide.active { display: flex; }
                        
                        /* Custom radio styling for visual feedback */
                        .custom-radio { transition: all 0.2s; }
                        .custom-radio[aria-checked="true"] { border-color: #2563eb; background-color: #eff6ff; }
                    </style>
                </head>
                <body>
                    
                    <!-- REQUIRED SLIDE 0 -->
                    <div id="slide-0" class="slide active">
                        <div class="max-w-md w-full p-8 border rounded-xl shadow-sm bg-gray-50 space-y-6">
                            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <h2 class="text-2xl font-bold">Welcome to the Lesson</h2>
                            <!-- EXACT LOCATOR: <div aria-label='Start' role='button'> -->
                            <div aria-label="Start" role="button" onclick="nextSlide()" class="w-full py-3 bg-blue-600 text-white rounded-lg shadow cursor-pointer hover:bg-blue-700 font-semibold transition-colors">Start Lesson</div>
                        </div>
                    </div>

                    <!-- REQUIRED SLIDE 1 (Radio MCQ) -->
                    <div id="slide-1" class="slide">
                        <div class="max-w-2xl w-full text-left">
                            <!-- EXACT LOCATOR: <div aria-label='Question'> -->
                            <div aria-label="Question" class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Question 1</div>
                            
                            <!-- EXACT LOCATOR: <div aria-label='Which planet is known as the Red Planet?'> -->
                            <div aria-label="Which planet is known as the Red Planet?" class="text-2xl font-bold text-gray-900 mb-8">Which planet is known as the Red Planet?</div>
                            
                            <div class="space-y-3 mb-8">
                                <!-- EXACT LOCATORS: <div role='radio' aria-label='Earth'> -->
                                <div role="radio" aria-label="Earth" aria-checked="false" onclick="selectRadio(this)" class="custom-radio w-full p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-blue-300 font-medium text-gray-700">Earth</div>
                                <!-- EXACT LOCATORS: <div role='radio' aria-label='Mars'> -->
                                <div role="radio" aria-label="Mars" aria-checked="false" onclick="selectRadio(this)" class="custom-radio w-full p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-blue-300 font-medium text-gray-700">Mars</div>
                                <div role="radio" aria-label="Jupiter" aria-checked="false" onclick="selectRadio(this)" class="custom-radio w-full p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-blue-300 font-medium text-gray-700">Jupiter</div>
                            </div>
                            
                            <div class="flex justify-end">
                                <!-- EXACT LOCATOR: <button class='slide-control-button-submit'>SUBMIT</button> -->
                                <button class="slide-control-button-submit px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded shadow transition-colors" onclick="nextSlide()">SUBMIT</button>
                            </div>
                        </div>
                    </div>

                    <!-- REQUIRED SLIDE 2 (Feedback 1) -->
                    <div id="slide-2" class="slide">
                        <div class="max-w-md w-full p-8 border rounded-xl shadow-sm bg-green-50 space-y-6 border-green-200">
                            <div class="w-16 h-16 bg-green-200 text-green-700 rounded-full flex items-center justify-center mx-auto">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <!-- EXACT LOCATOR: <div aria-label='Correct'> -->
                            <div aria-label="Correct" class="text-3xl font-extrabold text-green-700">Correct</div>
                            <p class="text-green-800 text-sm">Mars is known as the Red Planet due to the iron oxide on its surface.</p>
                            
                            <!-- EXACT LOCATOR: <div aria-label='Continue' role='button'> -->
                            <div aria-label="Continue" role="button" onclick="nextSlide()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded shadow cursor-pointer transition-colors mt-4">Continue</div>
                        </div>
                    </div>

                    <!-- REQUIRED SLIDE 3 (Input Answer) -->
                    <div id="slide-3" class="slide">
                        <div class="max-w-2xl w-full text-left">
                            <!-- EXACT LOCATOR: <div aria-label='Question'> -->
                            <div aria-label="Question" class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Question 2</div>
                            
                            <!-- EXACT LOCATOR: <div aria-label='What is 12 plus 8?'> -->
                            <div aria-label="What is 12 plus 8?" class="text-2xl font-bold text-gray-900 mb-6">What is 12 plus 8?</div>
                            
                            <div class="mb-8">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Enter your answer below:</label>
                                <!-- EXACT LOCATOR: <input type='text'> -->
                                <input type="text" class="block w-full px-4 py-3 border-2 border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-lg">
                            </div>
                            
                            <div class="flex justify-end">
                                <!-- EXACT LOCATOR: <div aria-label='Submit' role='button'> -->
                                <div aria-label="Submit" role="button" onclick="nextSlide()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded shadow cursor-pointer transition-colors text-center inline-block">Submit</div>
                            </div>
                        </div>
                    </div>

                    <!-- REQUIRED SLIDE 4 (Feedback 2) -->
                    <div id="slide-4" class="slide">
                        <div class="max-w-md w-full p-8 border rounded-xl shadow-sm bg-green-50 space-y-6 border-green-200">
                             <div class="w-16 h-16 bg-green-200 text-green-700 rounded-full flex items-center justify-center mx-auto">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <!-- EXACT LOCATOR: <div aria-label='Correct'> -->
                            <div aria-label="Correct" class="text-3xl font-extrabold text-green-700">Correct</div>
                            
                            <!-- EXACT LOCATOR: <button class='slide-control-button-next'>Next</button> -->
                            <button class="slide-control-button-next w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded shadow cursor-pointer transition-colors mt-4 border-0" onclick="nextSlide()">Next</button>
                        </div>
                    </div>

                    <!-- REQUIRED SLIDE 5 (Results) -->
                    <div id="slide-5" class="slide">
                         <div class="max-w-md w-full p-8 border rounded-xl shadow-sm bg-gray-50 space-y-6 border-gray-200 text-center">
                            <div class="w-20 h-20 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-900">Lesson Complete!</h2>
                            <p class="text-gray-500">You scored 100%.</p>
                            
                            <!-- EXACT LOCATOR: <div aria-label='Results' role='button'> -->
                            <div aria-label="Results" role="button" class="w-full py-3 bg-purple-600 text-white rounded-lg shadow font-semibold">Results</div>
                        </div>
                    </div>

                    <script>
                        // Iframe internal slide logic
                        let currentSlide = 0;
                        const totalSlides = 5;

                        function nextSlide() {
                            document.getElementById('slide-' + currentSlide).classList.remove('active');
                            currentSlide++;
                            if(currentSlide <= totalSlides) {
                                document.getElementById('slide-' + currentSlide).classList.add('active');
                            }
                        }

                        // Required radio button interaction logic
                        function selectRadio(element) {
                            const radios = document.querySelectorAll('[role="radio"]');
                            radios.forEach(r => {
                                r.setAttribute('aria-checked', 'false');
                            });
                            element.setAttribute('aria-checked', 'true');
                        }
                    <\/script>
                </body>
                </html>
            `;

            // CRITICAL STEP FOR PLAYWRIGHT:
            // Using a Blob URL so the frame URL doesn't start with "about:blank"
            // The Playwright script explicitly ignores frames starting with "about:blank".
            const blob = new Blob([iframeHTML], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);
            
            const iframeContainer = document.getElementById('iframe-container');
            iframeContainer.innerHTML = ''; // Clear previous

            const iframe = document.createElement('iframe');
            iframe.src = blobUrl;
            iframe.className = "w-full max-w-4xl h-[600px] bg-white rounded-xl shadow-2xl border-0 overflow-hidden";
            iframe.title = "Interactive Lesson Player";
            
            iframeContainer.appendChild(iframe);
        }
    </script>
</body>
</html>
